<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #030303;
        --border-emerald: rgba(115, 255, 185, 0.4);
        --border-subtle: rgba(229, 231, 235, 0.15);
        --ink: #ffffff;
        --ink-muted: #e2e8f0;
        --emerald: #73ffb9;
        --font-sans: 'Inter', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-sans);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 50%, #0d1527 0%, #030303 80%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        pointer-events: none;
      }
      .tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        border-radius: 9999px;
        background: rgba(115, 255, 185, 0.1);
        border: 1px solid var(--border-emerald);
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 700;
        color: var(--emerald);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 32px;
        z-index: 2;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--emerald);
        box-shadow: 0 0 12px var(--emerald);
      }
      .hook-title {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.03em;
        color: #ffffff;
        max-width: 1380px;
        margin-bottom: 40px;
        z-index: 2;
      }
      .gradient-text {
        background: linear-gradient(135deg, #ffffff 20%, #73ffb9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hook-sub {
        font-family: var(--font-mono);
        font-size: 18px;
        color: #e2e8f0;
        letter-spacing: 0.06em;
        display: flex;
        gap: 36px;
        justify-content: center;
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid var(--border-subtle);
        padding: 16px 36px;
        border-radius: 14px;
        z-index: 2;
      }
      .hook-sub span {
        color: var(--emerald);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene1" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
      <div class="grid-overlay"></div>
      
      <div class="tag-pill" id="s1-pill" data-layout-ignore="true">
        <span class="status-dot"></span>
        NexusSwarm OS // v2.0
      </div>

      <h1 class="hook-title" id="s1-title" data-hold="true">
        What happens when you give<br />
        <span class="gradient-text">28 autonomous AI agents</span><br />
        real engineering tools?
      </h1>

      <div class="hook-sub" id="s1-sub" data-layout-ignore="true">
        <div>[ <span>28 SPECIALISTS</span> ]</div>
        <div>[ <span>6 DIVISIONS</span> ]</div>
        <div>[ <span>TOOL-LAYER GOVERNANCE</span> ]</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene1"] = tl;

      tl.set(["#s1-pill", "#s1-title", "#s1-sub"], { opacity: 1 });

      tl.from("#s1-pill", { scale: 0.95, duration: 0.3, ease: "power2.out" }, 0);
      tl.from("#s1-title", { y: 20, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.from("#s1-sub", { y: 15, duration: 0.4, ease: "power3.out" }, 0.3);

      // Subtle pulse during hold
      tl.to("#s1-title", { scale: 1.02, duration: 1.6, ease: "sine.inOut" }, 1.8);

      tl.to("#root", {
        opacity: 0,
        scale: 0.97,
        duration: 0.3,
        ease: "power2.in"
      }, 3.9);

      tl.seek(0);
    </script>
  </body>
</html>
